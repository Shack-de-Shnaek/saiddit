# Production-like overrides: runs the hosting images and their entrypoints
# instead of the dev servers.
#
#   docker compose -f compose.yaml -f compose.prod.yaml up --build

services:
  backend:
    build:
      target: hosting
    # Drop the dev-only settings so the image's entrypoint (migrate) and CMD
    # (gunicorn) run against the code baked into the image.
    command: !reset null
    working_dir: !reset null
    volumes: !reset []
    environment:
      # Fixed rather than ${...}: a dev .env setting LOCAL/true must not leak in.
      ENVIRONMENT: PROD
      DJANGO_DEBUG: "false"
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      # The frontend calls the API cross-origin, so it has to be trusted for
      # CSRF as well as allowed through CORS.
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      # No insecure fallbacks in prod: refuse to start until these are set.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  frontend:
    build:
      target: hosting
      args:
        # Baked into the bundle at build time; the runtime environment is ignored.
        VITE_API_URL: ${API_URL:?set API_URL}
    command: !reset null
    working_dir: !reset null
    environment: !reset {}
    volumes: !reset []
    ports: !override
      - "8080:80"
