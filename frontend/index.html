<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes
      // the wrong colours. Keep the key in sync with src/composables/useTheme.js.
      try {
        var theme = localStorage.getItem('saiddit-theme') || 'dark'
        document.documentElement.classList.toggle('dark', theme === 'dark')
      } catch (e) {
        /* Storage can be blocked; the dark class in the markup is the fallback. */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
