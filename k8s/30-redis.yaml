# Cache + sessions only, so it runs without persistence.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: saiddit
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: saiddit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10-alpine3.23
          args: ["--save", "", "--loglevel", "warning"]
          ports:
            - containerPort: 6379
