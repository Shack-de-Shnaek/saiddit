# kind create cluster --config k8s/kind/cluster.yaml
# then apply ingress-nginx.yaml and metrics-server.yaml (or just run ./setup.sh).
# Maps host ports 80/443 to the node so ingress-nginx answers on localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: saiddit
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
      - containerPort: 443
        hostPort: 443
