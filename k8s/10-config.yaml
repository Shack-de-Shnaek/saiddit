# Shared by the backend, postgres and garage. Secret values are dev-only
# placeholders committed for the demo; replace them for anything real.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: saiddit
data:
  POSTGRES_DB: saiddit
  POSTGRES_USER: saiddit
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: saiddit
type: Opaque
stringData:
  POSTGRES_PASSWORD: saiddit-k8s-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: saiddit
data:
  ENVIRONMENT: PROD
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: saiddit.localhost
  DJANGO_CORS_ALLOWED_ORIGINS: http://saiddit.localhost
  DJANGO_CSRF_TRUSTED_ORIGINS: http://saiddit.localhost
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_CONN_MAX_AGE: "60"
  REDIS_URL: redis://redis:6379/0
  AWS_STORAGE_BUCKET_NAME: saiddit
  AWS_S3_REGION_NAME: garage
  # The backend talks to garage in-cluster; browsers get public URLs on the
  # website endpoint instead, which the ingress exposes under this host.
  AWS_S3_ENDPOINT_URL: http://garage:3900
  AWS_S3_CUSTOM_DOMAIN: saiddit.web.garage.localhost
  AWS_S3_URL_PROTOCOL: "http:"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: saiddit
type: Opaque
stringData:
  DJANGO_SECRET_KEY: k8s-demo-secret-key-change-me-3f9a1c7e2b8d4f6a
  AWS_ACCESS_KEY_ID: GK0123456789abcdef01234567
  AWS_SECRET_ACCESS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
