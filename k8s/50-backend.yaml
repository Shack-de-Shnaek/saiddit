apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: saiddit
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: saiddit
spec:
  # No replicas: the HorizontalPodAutoscaler below owns the count, and a
  # fixed value here would reset it on every apply.
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        # The entrypoint migrates on start, so wait for the database first.
        - name: wait-for-postgres
          image: postgres:18.6-alpine3.24
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
      containers:
        - name: backend
          image: DOCKERHUB_USER/saiddit-backend:IMAGE_TAG
          ports:
            - containerPort: 8000
          # The HPA measures CPU as a percentage of this request.
          resources:
            requests:
              cpu: 200m
              memory: 320Mi
            limits:
              memory: 768Mi
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secret
          # TCP rather than HTTP: ALLOWED_HOSTS rejects the kubelet's pod-IP Host header.
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: saiddit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
